serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
set timeout=8
set default=0
menuentry "KotOS 1.0 (графика)" {
  multiboot /boot/kotos.elf gui=1
  boot
}
menuentry "KotOS 1.0 (терминал)" {
  multiboot /boot/kotos.elf gui=0
  boot
}
menuentry "Установить KotOS" {
  multiboot /boot/kotos.elf install=1
  boot
}
menuentry "KotOS x64 (экспериментальное, Linux ABI)" {
  multiboot /boot/kotos64.elf
  module /boot/linux_glibc.elf linux_app
  boot
}
menuentry "KotOS 1.0 (безопасный режим)" {
  multiboot /boot/kotos.elf gui=0 install=0
  boot
}
